<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repositories Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-github"></i> GitHub Repositories Dashboard</h1>
            <p class="subtitle">Real-time monitoring of my side projects</p>
            <div class="header-info">
                <span id="last-updated">Last updated: --</span>
                <button id="refresh-btn" onclick="refreshAll()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </header>

        <div class="stats-overview">
            <div class="stat-card">
                <i class="fas fa-code-branch"></i>
                <div class="stat-content">
                    <span class="stat-value" id="total-repos">0</span>
                    <span class="stat-label">Repositories</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-star"></i>
                <div class="stat-content">
                    <span class="stat-value" id="total-stars">0</span>
                    <span class="stat-label">Total Stars</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-code-fork"></i>
                <div class="stat-content">
                    <span class="stat-value" id="total-forks">0</span>
                    <span class="stat-label">Total Forks</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-eye"></i>
                <div class="stat-content">
                    <span class="stat-value" id="total-watchers">0</span>
                    <span class="stat-label">Total Watchers</span>
                </div>
            </div>
        </div>

        <div class="repos-grid" id="repos-container">
            <!-- Repository cards will be inserted here -->
        </div>
    </div>

    <footer>
        <p>Built with <i class="fas fa-heart" style="color: #e25555;"></i> | Data from GitHub API</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
