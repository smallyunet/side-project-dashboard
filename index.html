<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <div class="header-title">
                    <h2>Dashboard</h2>
                    <span class="last-updated" id="last-updated">Updated: --</span>
                </div>
                <div class="header-actions">
                    <button id="refresh-btn" class="btn-primary">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </header>

            <div id="stats" class="section-container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon stars">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Stars</h3>
                            <span class="stat-value" id="total-stars">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon forks">
                            <i class="fas fa-code-branch"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Forks</h3>
                            <span class="stat-value" id="total-forks">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon repos">
                            <i class="fas fa-book"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Repositories</h3>
                            <span class="stat-value" id="total-repos">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon issues">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Open Issues</h3>
                            <span class="stat-value" id="total-issues">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="repositories" class="section-container">
                <div class="section-header">
                    <h3>Repositories</h3>
                    <div class="filters-inline">
                        <select id="sort-select">
                            <option value="updated">Last Updated</option>
                            <option value="stars">Stars</option>
                            <option value="forks">Forks</option>
                            <option value="created">Created Date</option>
                        </select>
                    </div>
                </div>
                <div class="repos-grid" id="repos-container">
                    <!-- All repos will be inserted here -->
                </div>
            </div>

            <div id="activity" class="section-container">
                <div class="section-header">
                    <h3>Recent Activity</h3>
                </div>
                <div class="timeline-container" id="activity-timeline">
                    <!-- Activity timeline will be inserted here -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
