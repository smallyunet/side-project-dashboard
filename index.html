<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Project Dashboard</title>
    <meta name="description"
        content="A minimalist dashboard to monitor GitHub side projects - stars, forks, releases, and CI status.">
    <meta name="keywords" content="GitHub, Dashboard, Side Project, Repository Monitor">
    <meta property="og:title" content="Side Project Dashboard">
    <meta property="og:description" content="Monitor your GitHub side projects at a glance.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://spd.smallyu.net">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <div class="header-title">
                    <h2>🚀 Side Project Dashboard</h2>
                    <span class="last-updated" id="last-updated">Updated: --</span>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
            </header>

            <div id="stats" class="section-container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon stars">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Stars</h3>
                            <span class="stat-value" id="total-stars">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon forks">
                            <i class="fas fa-code-branch"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Forks</h3>
                            <span class="stat-value" id="total-forks">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon repos">
                            <i class="fas fa-book"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Repositories</h3>
                            <span class="stat-value" id="total-repos">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon issues">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Open Issues</h3>
                            <span class="stat-value" id="total-issues">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="repositories" class="section-container">
                <div class="section-header">
                    <h3>Repositories</h3>
                    <div class="filters-inline">
                        <select id="sort-select">
                            <option value="updated" selected>Last Updated</option>
                            <option value="default">Default</option>
                            <option value="stars">Stars</option>
                            <option value="forks">Forks</option>
                            <option value="created">Created Date</option>
                        </select>
                    </div>
                </div>
                <div class="repos-grid" id="repos-container">
                    <!-- All repos will be inserted here -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
